<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EEG Neurofeedback</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #eee; font-family: monospace; overflow: hidden; }

    #display {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: contain; display: none; cursor: pointer;
    }

    #overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; z-index: 10;
      background: #000;
    }
    #overlay.hidden { display: none; }
    h1 { font-size: 1.4rem; letter-spacing: 0.1em; color: #aaa; }
    button {
      padding: 12px 32px; background: #1a1a2e; border: 1px solid #555;
      color: #eee; font-family: monospace; font-size: 1rem; cursor: pointer;
      border-radius: 4px;
    }
    button:hover { border-color: #aaa; }
    #status { font-size: 0.85rem; color: #666; text-align: center; line-height: 1.8; }

    /* debug panel */
    #debug-panel {
      position: fixed; inset: 0; background: #050505;
      display: none; flex-direction: column;
      padding: 48px 28px 20px; gap: 16px; overflow: hidden;
    }
    #debug-panel.visible { display: flex; }
    .chart-block { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .chart-title {
      font-size: 0.65rem; color: #444; letter-spacing: 0.14em;
      margin-bottom: 6px; text-transform: uppercase;
    }
    .chart-wrap { flex: 1; min-height: 0; position: relative; }

    /* bug toggle button */
    #bug-btn {
      position: fixed; top: 12px; right: 14px; z-index: 50;
      background: none; border: none; font-size: 1.3rem;
      cursor: pointer; opacity: 0.35; padding: 4px;
      line-height: 1; border-radius: 4px;
      transition: opacity 0.15s;
    }
    #bug-btn:hover { opacity: 0.9; background: rgba(255,255,255,0.07); }

    #hud {
      position: fixed; bottom: 12px; left: 12px; font-size: 0.75rem;
      color: rgba(255,255,255,0.4); z-index: 20; pointer-events: none;
    }
    #click-hint {
      position: fixed; bottom: 12px; right: 14px; font-size: 0.65rem;
      color: rgba(255,255,255,0.2); z-index: 20; pointer-events: none;
    }
    #train-btn {
      position: fixed; top: 12px; left: 14px; z-index: 50;
      background: none; border: 1px solid #333; font-size: 0.75rem;
      font-family: monospace; color: #888; cursor: pointer; padding: 4px 10px;
      border-radius: 4px; transition: border-color 0.15s, color 0.15s;
    }
    #train-btn:hover { border-color: #888; color: #eee; }
    #train-btn.stopped { border-color: #4a4; color: #6d6; }
    #train-btn.running { border-color: #a44; color: #d66; }

    #eeg-banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: #7a1010; color: #ffcccc; padding: 7px 16px;
      font-size: 0.8rem; text-align: center; display: none;
    }
    #eeg-banner.visible { display: block; }
  </style>
</head>
<body>
  <img id="display" alt="">

  <div id="overlay">
    <h1>EEG Neurofeedback</h1>
    <button id="connectBtn">Connect Muse</button>
    <div id="status">Open ws://localhost:8765 first (run Python script)</div>
  </div>

  <div id="debug-panel">
    <div class="chart-block">
      <div class="chart-title">Raw EEG (µV)</div>
      <div class="chart-wrap"><canvas id="chart-eeg"></canvas></div>
    </div>
    <div class="chart-block">
      <div class="chart-title">EEG State</div>
      <div class="chart-wrap"><canvas id="chart-state"></canvas></div>
    </div>
    <div class="chart-block">
      <div class="chart-title">Reward / Loss</div>
      <div class="chart-wrap"><canvas id="chart-rl"></canvas></div>
    </div>
  </div>

  <div id="eeg-banner">EEG disconnected — reconnecting…</div>
  <button id="bug-btn" title="toggle debug view">🐛</button>
  <button id="train-btn" title="start/stop training">⏹ stop</button>
  <div id="hud"></div>
  <div id="click-hint"></div>

  <script type="module">
    import Chart from 'chart.js/auto';
    import { initEegWasm, AthenaWasmDecoder, getEegInterleavedSamples } from '@elata-biosciences/eeg-web';
    import { BleTransport } from '@elata-biosciences/eeg-web-ble';
    import wasmUrl from '@elata-biosciences/eeg-web/wasm/eeg_wasm_bg.wasm?url';

    const display    = document.getElementById("display");
    const overlay    = document.getElementById("overlay");
    const statusEl   = document.getElementById("status");
    const hud        = document.getElementById("hud");
    const hint       = document.getElementById("click-hint");
    const debugPanel = document.getElementById("debug-panel");
    const bugBtn     = document.getElementById("bug-btn");
    const trainBtn   = document.getElementById("train-btn");
    const btn        = document.getElementById("connectBtn");
    const eegBanner  = document.getElementById("eeg-banner");

    function setStatus(msg) { statusEl.textContent = msg; }
    function setHud(msg)    { hud.textContent = msg; }

    // ---------- View toggle ----------
    let showingDebug = false;

    function showDebug() {
      showingDebug = true;
      display.style.display = "none";
      debugPanel.classList.add("visible");
      hint.textContent = "🐛 click image to hide";
    }

    function showImage() {
      showingDebug = false;
      debugPanel.classList.remove("visible");
      display.style.display = "block";
      hint.textContent = "🐛 click for debug";
    }

    function toggle() {
      if (showingDebug) showImage(); else showDebug();
    }

    bugBtn.addEventListener("click", toggle);
    display.addEventListener("click", toggle);

    // ---------- Charts ----------
    const MAX_PTS = 80;
    const COORD_COLORS = ["#4fc3f7","#81c784","#ffb74d","#f06292","#ce93d8","#80cbc4","#fff176","#ffab91"];

    const BASE_OPTS = {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: "#777", font: { family: "monospace", size: 11 }, boxWidth: 12 } }
      },
      scales: {
        x: { ticks: { color: "#444", font: { family: "monospace", size: 9 }, maxTicksLimit: 8 },
             grid: { color: "#111" } },
        y: { ticks: { color: "#444", font: { family: "monospace", size: 9 } },
             grid: { color: "#111" } }
      }
    };

    function makeDs(label, color) {
      return { label, data: [], borderColor: color, borderWidth: 1.5,
               pointRadius: 0, tension: 0.3, fill: false };
    }

    const EEG_PTS = 256;
    const EEG_CH_COLORS = ["#4fc3f7","#81c784","#ffb74d","#f06292","#ce93d8","#80cbc4","#fff176","#ffab91"];
    const eegData = { labels: Array.from({length: EEG_PTS}, (_, i) => i), datasets: [] };
    let eegInited = false;
    let eegTick = 0;

    const chartEeg = new Chart(document.getElementById("chart-eeg"), {
      type: "line",
      data: eegData,
      options: {
        ...BASE_OPTS,
        plugins: { ...BASE_OPTS.plugins, legend: { ...BASE_OPTS.plugins.legend, labels: { ...BASE_OPTS.plugins.legend.labels, boxWidth: 10, font: { family: "monospace", size: 9 } } } },
      },
    });

    function pushEegSamples(samples, channelCount) {
      if (!eegInited) {
        eegInited = true;
        eegData.datasets = Array.from({length: channelCount}, (_, i) =>
          ({ label: `ch${i}`, data: new Array(EEG_PTS).fill(null),
             borderColor: EEG_CH_COLORS[i % EEG_CH_COLORS.length],
             borderWidth: 1, pointRadius: 0, tension: 0, fill: false })
        );
        chartEeg.update("none");
      }
      for (const row of samples) {
        const idx = eegTick % EEG_PTS;
        row.forEach((v, ch) => { if (eegData.datasets[ch]) eegData.datasets[ch].data[idx] = v; });
        eegTick++;
      }
      chartEeg.update("none");
    }

    const stateData = { labels: [], datasets: [] };
    const rlData = {
      labels: [],
      datasets: [
        makeDs("reward",     "#81c784"),
        makeDs("wm loss",    "#ef9a9a"),
        makeDs("actor loss", "#ffb74d"),
        makeDs("q loss",     "#ce93d8"),
      ],
    };

    const chartState = new Chart(document.getElementById("chart-state"), {
      type: "line", data: stateData, options: BASE_OPTS,
    });
    const chartRL = new Chart(document.getElementById("chart-rl"), {
      type: "line", data: rlData, options: BASE_OPTS,
    });

    let coordInited = false;

    function onMetrics(msg) {
      const { step, coord, reward, wm_loss, actor_loss, q_loss } = msg;

      if (!coordInited) {
        coordInited = true;
        const labels = coord.length === 2
          ? ["mood", "energy"]
          : coord.map((_, i) => `dim${i}`);
        stateData.datasets = labels.map((lbl, i) => makeDs(lbl, COORD_COLORS[i]));
        chartState.update("none");
      }

      stateData.labels.push(step);
      coord.forEach((v, i) => { if (stateData.datasets[i]) stateData.datasets[i].data.push(v); });
      if (stateData.labels.length > MAX_PTS) {
        stateData.labels.shift();
        stateData.datasets.forEach(ds => ds.data.shift());
      }

      rlData.labels.push(step);
      rlData.datasets[0].data.push(reward);
      rlData.datasets[1].data.push(wm_loss);
      rlData.datasets[2].data.push(actor_loss ?? null);
      rlData.datasets[3].data.push(q_loss ?? null);
      if (rlData.labels.length > MAX_PTS) {
        rlData.labels.shift();
        rlData.datasets.forEach(ds => ds.data.shift());
      }

      chartState.update("none");
      chartRL.update("none");
    }

    // ---------- Title spinner (shows while image is generating) ----------
    const spinFrames = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
    let spinIdx = 0, spinTimer = null;

    function startSpin() {
      if (spinTimer) return;
      spinTimer = setInterval(() => {
        document.title = spinFrames[spinIdx++ % spinFrames.length] + ' EEG Neurofeedback';
      }, 100);
    }

    function stopSpin() {
      clearInterval(spinTimer); spinTimer = null;
      document.title = 'EEG Neurofeedback';
    }

    // ---------- WebSocket (auto-reconnect) ----------
    let ws = null;

    function connectWs() {
      ws = new WebSocket("ws://localhost:8765");
      ws.onopen = () => setStatus("WebSocket connected — press Connect Muse");
      ws.onclose = () => {
        setStatus("WebSocket disconnected — retrying in 2s…");
        setTimeout(connectWs, 2000);
      };
      ws.onerror = () => {};
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === "image") {
          stopSpin();
          display.src = msg.data;
          if (!showingDebug) {
            display.style.display = "block";
            hint.textContent = "🐛 click for debug";
          }
          overlay.classList.add("hidden");
        } else if (msg.type === "status") {
          setHud(msg.text);
        } else if (msg.type === "metrics") {
          startSpin();
          onMetrics(msg);
        } else if (msg.type === "train_state") {
          setTrainState(msg.running);
        } else if (msg.type === "eeg_disconnected") {
          eegBanner.classList.add("visible");
          if (!reconnectTimer && bleHasDevice && !bleStreaming) {
            reconnectTimer = setTimeout(tryBleReconnect, 1000);
          }
        } else if (msg.type === "eeg_reconnected") {
          eegBanner.classList.remove("visible");
        }
      };
    }

    connectWs();

    // ---------- Train start/stop ----------
    let trainRunning = true;

    function setTrainState(running) {
      trainRunning = running;
      if (running) {
        trainBtn.textContent = "⏹ stop";
        trainBtn.className = "running";
      } else {
        trainBtn.textContent = "▶ start";
        trainBtn.className = "stopped";
      }
    }

    trainBtn.addEventListener("click", () => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      if (trainRunning) {
        ws.send(JSON.stringify({ type: "train_stop" }));
      } else {
        ws.send(JSON.stringify({ type: "train_start" }));
      }
    });

    // ---------- BLE + WASM ----------
    let transport = null;
    let bleStreaming = false;
    let bleHasDevice = false;
    let reconnectTimer = null;

    function clearReconnectTimer() {
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    }

    async function tryBleReconnect() {
      reconnectTimer = null;
      if (!transport || !bleHasDevice || bleStreaming) return;
      setStatus("Reconnecting to Muse…");
      try {
        await transport.startStreaming();
        bleStreaming = true;
        btn.textContent = "Streaming";
        btn.disabled = true;
      } catch (err) {
        setStatus(`Reconnect failed — retrying in 3s… (or press Connect Muse)`);
        btn.disabled = false;
        btn.textContent = "Connect Muse";
        reconnectTimer = setTimeout(tryBleReconnect, 3000);
      }
    }

    try {
      await initEegWasm(wasmUrl);
      setStatus("WASM ready — press Connect Muse");

      transport = new BleTransport({
        deviceOptions: { athenaDecoderFactory: () => new AthenaWasmDecoder() },
      });

      transport.onFrame = (frame) => {
        const { channelCount } = frame.eeg;
        const interleaved = getEegInterleavedSamples(frame);
        const nSamples = interleaved.length / channelCount;
        const samples = [];
        for (let i = 0; i < nSamples; i++) {
          samples.push(
            Array.from(interleaved.subarray(i * channelCount, (i + 1) * channelCount))
          );
        }
        if (showingDebug) pushEegSamples(samples, channelCount);
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: "eeg_frame", samples }));
      };

      transport.onStatus = (s) => {
        setStatus(`Muse: ${s.state}${s.reason ? " — " + s.reason : ""}`);
        if (/disconnect|error/i.test(s.state) && bleStreaming) {
          bleStreaming = false;
          btn.disabled = false;
          btn.textContent = "Connect Muse";
          if (!reconnectTimer) reconnectTimer = setTimeout(tryBleReconnect, 2000);
        }
        if (/connect(?:ed|ing)/i.test(s.state) && !bleStreaming) {
          bleStreaming = true;
          clearReconnectTimer();
          eegBanner.classList.remove("visible");
          btn.textContent = "Streaming";
          btn.disabled = true;
        }
      };
    } catch (e) {
      console.warn("BLE/WASM unavailable (mock-eeg mode OK):", e);
      btn.textContent = "BLE unavailable";
      btn.disabled = true;
    }

    btn.onclick = async () => {
      if (!transport) return;
      clearReconnectTimer();
      btn.disabled = true;
      btn.textContent = "Connecting…";
      try {
        await transport.startStreaming();
        bleStreaming = true;
        bleHasDevice = true;
        btn.textContent = "Streaming";
      } catch (err) {
        bleStreaming = false;
        btn.disabled = false;
        btn.textContent = "Connect Muse";
        setStatus(`BLE error: ${err.message}`);
      }
    };
  </script>
</body>
</html>
